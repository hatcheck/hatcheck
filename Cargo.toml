# The Rust port of hatcheck (crates/hatcheck), which replaces the Python CLI in hatcheck/; see
# docs/rust-port.md. The desktop app is its own project, which runs the hatcheck binary.
[workspace]
members = ["crates/hatcheck"]
exclude = ["desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/hatcheck/hatcheck"
homepage = "https://hatcheck.dev"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile cargo-dist builds the release binaries with: the release one.
[profile.dist]
inherits = "release"
