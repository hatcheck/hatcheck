name: PyPI

# A tag such as v0.2.0 releases the hatcheck CLI. This workflow builds its PyPI package with
# maturin, a wheel per platform with the Rust binaries as its commands and the source as an
# sdist, and publishes it through trusted publishing. v-release.yml, which cargo-dist writes
# from dist-workspace.toml, builds the same binaries for the GitHub release, with the shell and
# PowerShell installers and the Homebrew formula. Each can be re-run on its own.
#
# PyPI's trusted publisher for the project names this file (release.yml) and the pypi
# environment; it can't be a reusable workflow, which is why this isn't a cargo-dist job. The
# tag must match the version in Cargo.toml. Run by hand with a tag, it builds and publishes
# that release's package with this workflow as it is now, for a release whose run here failed:
#   gh workflow run release.yml -f tag=v0.2.0

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, such as v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: The tag matches the version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          test "v$version" = "$TAG" || { echo "The tag is $TAG but the version is $version"; exit 1; }

  wheels:
    name: wheel, ${{ matrix.platform.target }}
    needs: version
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, runs: true }
          # On ARM itself: the image maturin cross-compiles in has a GCC too old for ring's assembly.
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, runs: true }
          - { runner: macos-15-intel, target: x86_64-apple-darwin, runs: true }
          - { runner: macos-latest, target: aarch64-apple-darwin, runs: true }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, runs: true }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          manylinux: auto
      - name: Run its commands
        if: matrix.platform.runs
        shell: bash
        run: |
          python3 -m venv venv || python -m venv venv
          bin=venv/bin; [ -d venv/Scripts ] && bin=venv/Scripts
          "$bin/python" -m pip install --quiet dist/*.whl
          "$bin/hatcheck" --version
          "$bin/hat" --help > /dev/null
          set +e
          "$bin/cl" > out.txt 2>&1; code=$?
          set -e
          test "$code" = 2 && grep -q "usage: cl" out.txt
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.platform.target }}
          path: dist/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: package-sdist
          path: dist/*.tar.gz

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
