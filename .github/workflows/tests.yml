name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          # Apple-silicon runners may have no Python 3.9 build; macOS's own python3 is 3.9.
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  rust:
    # The Rust port (crates/hatcheck): its own tests, then the Python tests of the
    # subcommands it has, run against its binary (tests/conformance.py).
    name: rust, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format and lint
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo fmt -p hatcheck --check
          cargo clippy -p hatcheck --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p hatcheck
      - name: The Python tests, against the Rust binary
        run: python tests/conformance.py

  package:
    name: package, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build and run the commands it installs
        shell: bash
        run: |
          uv build
          wheel=$(ls dist/*.whl)
          uvx --from "$wheel" hatcheck --version
          uvx --from "$wheel" hat --help > /dev/null
          uvx --from "$wheel" hatcheck usage --json --cached > /dev/null
          set +e
          uvx --from "$wheel" cl > out.txt 2>&1; code=$?
          set -e
          test "$code" = 2 && grep -q "usage: cl" out.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck cl cx install.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = 0
          foreach ($file in Get-ChildItem -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Output "$($file.Name): $($e.Message) (line $($e.Extent.StartLineNumber))"; $failed++ }
          }
          exit $failed
