name: desktop

# Builds the Hatcheck app for macOS (Apple silicon and Intel), Windows and Linux. A tag such as
# desktop-v0.1.0 makes a draft GitHub release with the installers and the updater's
# latest.json; a tag with a hyphen after the version, such as desktop-v0.2.0-beta.1, makes a
# pre-release, the beta channel. Run by hand, it builds and keeps the files as artifacts.
#
# Signing, each part only when its secrets are set (Settings > Secrets and variables > Actions):
#   updates  TAURI_SIGNING_PRIVATE_KEY (the text of ~/.tauri/hatcheck-updater.key) and
#            TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty for that key)
#   macOS    APPLE_CERTIFICATE (the Developer ID Application .p12, base64), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, and for notarizing APPLE_ID, APPLE_PASSWORD (an app-specific
#            password) and APPLE_TEAM_ID
# Without them the app is built unsigned, as for your own use.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: macOS-Intel, os: macos-15-intel }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: The hatcheck engine, the Rust binary
        run: node desktop/scripts/build-engine.mjs
      - name: Signing, where its secrets are set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set_env() { { echo "$1<<HATCHECK_EOF"; echo "$2"; echo "HATCHECK_EOF"; } >> "$GITHUB_ENV"; }
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            set_env TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            set_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            # Signed update files and latest.json, for the app's updater.
            python3 -c "import json; p='desktop/src-tauri/tauri.conf.json'; c=json.load(open(p)); c['bundle']['createUpdaterArtifacts']=True; json.dump(c, open(p,'w'), indent=2)"
          fi
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!v}" ] && set_env "$v" "${!v}"
            done
          fi
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Hatcheck ${{ github.ref_name }}
          releaseBody: The Hatcheck app. Unofficial; not made by, affiliated with or endorsed by Anthropic or OpenAI.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true
      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/')"
        working-directory: desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: hatcheck-${{ matrix.name }}
          path: desktop/src-tauri/target/release/bundle/
