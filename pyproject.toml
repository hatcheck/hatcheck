# The PyPI package: the Rust binaries (hatcheck, hat, cl, cx, ck, claude-z, claude-k), built by
# maturin into one wheel per platform, the way ruff and uv ship. No Python code; the version
# comes from Cargo.toml. Build one with: uvx maturin build --release
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "hatcheck"
dynamic = ["version"]
description = "Claude Code, Codex, Antigravity CLI, Kimi Code CLI, ZCode, DeepSeek Harness, MiniMax Code, Qwen Code, GitHub Copilot CLI and OpenCode accounts on one computer, each kept apart: recent sessions, plan usage, resume or open commands and moves across them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yi Wang" }]
keywords = ["claude", "claude-code", "codex", "cli", "profiles", "sessions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hatcheck/hatcheck"
Issues = "https://github.com/hatcheck/hatcheck/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/hatcheck/Cargo.toml"
