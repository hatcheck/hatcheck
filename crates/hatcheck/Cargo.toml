[package]
name = "hatcheck"
description = "Claude Code and Codex accounts on one computer, each kept apart: recent sessions, plan usage, resume commands and moves across all of them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hatcheck"
path = "src/main.rs"

[[bin]]
name = "hat"
path = "src/bin/hat.rs"

# The launchers, which the hatcheck binary also runs as when it's called by their names.
[[bin]]
name = "cl"
path = "src/bin/cl.rs"

[[bin]]
name = "cx"
path = "src/bin/cx.rs"

[[bin]]
name = "claude-z"
path = "src/bin/claude-z.rs"

[[bin]]
name = "claude-k"
path = "src/bin/claude-k.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
getrandom = "0.3"
memchr = "2"
memmap2 = "0.9"
plist = "1"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
terminal_size = "0.4"
ureq = { version = "3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
