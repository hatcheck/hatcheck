[package]
name = "hatcheck"
description = "Claude Code, Codex, Antigravity CLI, Kimi Code CLI, ZCode, DeepSeek Harness and MiniMax Code accounts on one computer, each kept apart"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["claude", "claude-code", "codex", "cli", "sessions"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "hatcheck"
path = "src/main.rs"

[[bin]]
name = "hat"
path = "src/bin/hat.rs"

# The launchers, which the hatcheck binary also runs as when it's called by their names.
[[bin]]
name = "cl"
path = "src/bin/cl.rs"

[[bin]]
name = "cx"
path = "src/bin/cx.rs"

[[bin]]
name = "ck"
path = "src/bin/ck.rs"

[[bin]]
name = "claude-z"
path = "src/bin/claude-z.rs"

[[bin]]
name = "claude-k"
path = "src/bin/claude-k.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
getrandom = "0.3"
memchr = "2"
memmap2 = "0.9"
plist = "1"
png = "0.18"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
terminal_size = "0.4"
ureq = { version = "3", features = ["json"] }
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

# cargo binstall hatcheck: the binaries the GitHub release already has, named and packed as
# cargo-dist makes them (v-release.yml), instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
